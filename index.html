<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    /* Mengatur halaman agar memenuhi layar penuh tanpa scrollbar */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://i.imgur.com/IMDCOdl.jpeg'); /* Mengubah latar belakang menjadi langit malam bertabur bintang */
      background-size: cover; /* Memastikan gambar menutupi seluruh layar secara proporsional */
      background-position: center; /* Memosisikan gambar latar di tengah */
      background-repeat: no-repeat; /* Mencegah gambar berulang/tile jika layar terlalu besar */
      overflow: hidden; /* Menghilangkan scrollbar */
      display: flex;
      justify-content: center; /* Memosisikan objek di tengah secara horizontal */
      align-items: center; /* Memosisikan objek di tengah secara vertikal */
    }

    /* Mengatur link agar memenuhi area flexbox */
    a {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      text-decoration: none;
    }

    /* Mengatur gambar agar responsif dan menyesuaikan ukuran layar secara otomatis */
    img {
      max-width: 500%;
      max-height: 50%;
      object-fit: contain; /* Gambar akan membesar/mengecil tanpa merusak rasio aslinya */
    }
  </style>
</head>
<body>

  <a href="https://script.google.com/macros/s/AKfycbzKVkEOv-e7tJ5pJ-EbmqbQDK1LaSBpCLWdrmxppROcFdxhfJXP73DMG42NANfjxqyswA/exec">
    <img src="https://i.imgur.com/YmvaJNc.png">
  </a>

</body>
</html>
